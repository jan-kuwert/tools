[build]
  command = "npm run build"
  publish = "dist"

# PUBLIC_API_URL (Cloud Run origin) must be set in Netlify env for the cloud tool.
# connect-src allows *.run.app; narrow it to the exact Cloud Run origin on deploy.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob: data: https://*.run.app; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/tools/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Local dev convenience: bare domain root goes to the tools base.
[[redirects]]
  from = "/"
  to = "/tools/"
  status = 302
