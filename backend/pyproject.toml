[project]
name = "tools-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pillow",
    "rembg[cpu]",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
